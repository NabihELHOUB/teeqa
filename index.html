  <!-- Adresse « ?zero » (celle du QR d'essai) : on repart de zéro, lancement compris. Le « ?zero » est retiré de l'adresse
       aussitôt, pour qu'un simple rechargement pendant l'essai garde l'état en cours. -->
  <script>
    if (/[?&]zero\b/.test(location.search)) {
      try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
      history.replaceState(null, '', location.pathname);
    }
  </script>
  <!-- Embarquée dans un téléphone de la page vitrine (index.html?vitrine) : on réserve la place de l'îlot et de la barre d'accueil. -->
  <script>if (/[?&]vitrine\b/.test(location.search)) document.documentElement.classList.add('in-vitrine');</script>
